<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>@thekzbn library</title>

	<link rel="shortcut icon" href="https://cdn.thekzbn.name.ng/assets/img/thekzbn%20library%20logo.svg" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		rel="stylesheet">
	<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

	<div class="app" role="application" aria-label="@thekzbn library app">

		<header class="header">
			<a class="brand" href="https://thekzbn.name.ng" aria-label="@thekzbn home">
				<img src="https://cdn.thekzbn.name.ng/assets/img/thekzbn%20library%20logo.svg" alt="" class="brand-logo">
				<span>@thekzbn</span>
			</a>

			<div class="controls" role="region" aria-label="Controls">
				<button id="themeToggle" class="icon-btn theme-toggle" title="Toggle theme">
					<span class="material-symbols-outlined">dark_mode</span>
				</button>
				<button id="btnUp" class="icon-btn" title="Go up">
					<span class="material-symbols-outlined">arrow_upward</span>up
				</button>
				<button id="homeBtn" class="icon-btn secondary" title="Go to library root">
					<i class='bx bx-home'></i>home
				</button>
			</div>
		</header>

		<main>
			<section class="hero" aria-labelledby="pageTitle">
				<h1 id="pageTitle">library</h1>
			</section>

			<section class="catalog" aria-labelledby="catalogTitle">
				<div class="catalog-label">
					<h2 id="catalogTitle">catalogue</h2>
					<p id="libraryStatus">private drive index</p>
				</div>

				<div class="catalog-body">
					<div class="search" role="search" aria-label="Search files">
						<input id="searchInput" type="search" placeholder="search titles, authors, types..."
							aria-label="Search files">
						<select id="sortSelect" aria-label="Sort files">
							<option value="name">sort: name</option>
							<option value="modifiedTime">sort: newest</option>
						</select>
					</div>

					<nav id="breadcrumb" class="breadcrumb" aria-label="Current library path">
						<button class="crumb" type="button" data-index="0">library</button>
					</nav>

					<div id="grid" class="grid" aria-live="polite"></div>

					<div id="empty" class="empty" hidden>no items found.</div>
				</div>
			</section>
		</main>

		<footer class="footer">© 2026 @thekzbn / library</footer>
	</div>


	<div id="backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
		<div class="modal" role="document">
			<header>
				<div id="modalTitle"></div>
				<div class="modal-actions">
					<a id="openInDrive" href="#" target="_blank" rel="noopener">open in drive</a>
					<button id="closeModal" class="icon-btn" aria-label="Close preview">
						<span class="material-symbols-outlined">close</span>
					</button>
				</div>
			</header>
			<iframe id="previewFrame" title="Preview"></iframe>
		</div>
	</div>

	<script src="assets/js/script.js"></script>
</body>

</html>
